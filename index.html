<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude/Anthropic デイリーアーカイブ</title>
<style>
:root{--bg:#12100e;--panel:#1b1815;--panel2:#232019;--ink:#efe9df;--muted:#a99e8c;
--line:#332e26;--accent:#d9915b;--accent2:#c96442;--ok:#6fae8a;--warn:#d8b062;--no:#c07a72;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.lab{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin-right:5px;
vertical-align:middle;font-variant-numeric:tabular-nums}
.lab-ok{background:#22352b;color:var(--ok)} .lab-warn{background:#352d1a;color:var(--warn)}
.lab-no{background:#351f1c;color:var(--no)}
article h1{font-size:26px;margin:.2em 0 .6em;line-height:1.3}
article h2{font-size:19px;margin:1.6em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
article h3{font-size:15px;margin:1.3em 0 .4em;color:var(--accent)}
article p{margin:.6em 0}
article ul{padding-left:1.3em}
article code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:.9em}
article{overflow-wrap:anywhere}
article pre{background:#0d0b09;border:1px solid var(--line);padding:14px;border-radius:8px;overflow:auto}
article pre code{background:none;padding:0}
article table{border-collapse:collapse;margin:1em 0;font-size:13px;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:6px 10px;text-align:left}
article th{background:var(--panel2)}
article blockquote{border-left:3px solid var(--accent);margin:.8em 0;padding:.2em 1em;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge.pub{color:var(--ok);border-color:#2f4a3c}
.badge.prv{color:var(--warn);border-color:#4a3f27}

.page{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
header.top h1{font-size:19px;margin:0 0 3px}
header.top .sub{color:var(--muted);font-size:12px}
header.top .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#q{padding:8px 12px;border-radius:8px;border:1px solid var(--line);
background:var(--panel2);color:var(--ink);font-size:13px;min-width:210px}
.chip{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);
background:var(--panel2);color:var(--muted);cursor:pointer;user-select:none;
font-variant-numeric:tabular-nums}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.row.years{margin-bottom:10px}
.row.years .chip{font-size:13px;padding:5px 14px}
.row.months{margin-bottom:14px}
.count{color:var(--muted);font-size:12px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px;
cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:8px;
min-width:0;overflow:hidden}
.card:hover{border-color:var(--accent);background:var(--panel2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.dim{opacity:.35}
.card .d{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .d .wd{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.card .kind{font-size:10px;color:var(--warn);border:1px solid #4a3f27;border-radius:99px;
padding:1px 7px;margin-left:7px;vertical-align:middle;font-weight:400}
.card .topics{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink);min-width:0}
.card .topics span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .topics span::before{content:"— ";color:var(--muted)}
.card .sm{font-size:12px;color:var(--muted);line-height:1.6}
.card .badges{margin-top:auto}
.empty{color:var(--muted);padding:36px 0}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
padding:18px 22px 26px;margin-top:4px}
#panel .phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
#panel .pdate{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
#panel .pclose{margin-left:auto;display:flex;gap:8px}
.btn{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);
background:var(--panel2);color:var(--muted);cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loading{color:var(--muted);padding:26px 0}
.footer{color:var(--muted);font-size:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:14px}
noscript .ns{background:var(--panel);border:1px solid var(--accent2);border-radius:10px;
padding:16px 18px;margin:18px 0}
@media(max-width:560px){
 .page{padding:16px 13px 48px}
 header.top{flex-direction:column;align-items:stretch}
 header.top .tools{margin-left:0}
 #q{min-width:0;width:100%}
 .grid{grid-template-columns:1fr}
 #panel{padding:14px 14px 20px}
}
</style></head><body>
<div class="page">
<header class="top">
  <div>
    <h1>Claude デイリーアーカイブ</h1>
    <div class="sub">収集ニュースの公開ログ</div>
    <div style="margin-top:7px"><span class="badge pub">PUBLIC — 共有可</span></div>
  </div>
  <div class="tools">
    <input id="q" placeholder="検索（トピック・サマリ）..." aria-label="トピックとサマリを検索">
    <div class="row" id="labelfilters" role="group" aria-label="確度フィルタ">
      <span class="chip on" data-lab="all" tabindex="0" role="button">すべて</span>
      <span class="chip" data-lab="確認済" tabindex="0" role="button">確認済</span>
      <span class="chip" data-lab="要検証" tabindex="0" role="button">要検証</span>
      <span class="chip" data-lab="棄却" tabindex="0" role="button">棄却</span>
    </div>
  </div>
</header>

<div class="row years" id="years"></div>
<div class="row months" id="months"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<section id="panel" hidden aria-live="polite"></section>

<noscript><div class="ns">
 <strong>このページは JavaScript を有効にしてご覧ください。</strong>
 記事一覧は <code>index.json</code> を読み込んで描画しています。
 JavaScript を使わずに読む場合は、日別ページを直接開いてください
 （<code>days/YYYY-MM-DD.html</code> の形式。例: <a href="days/2026-09-13.html">最新日（2026-09-13）</a>）。
</div></noscript>

<div class="footer">claude-config archive · 公開ログ</div>
</div>
<script>
var LABELS=["確認済","要検証","棄却"];
var LABCLASS={"確認済":"lab-ok","要検証":"lab-warn","棄却":"lab-no"};
var WD=["日","月","火","水","木","金","土"];
var ALL=[], YEARS=[], year=null, month=null, lab="all", q="", openDate=null;
var navLock=false, gridScroll=0;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function ymOf(d){return d.slice(0,7);}
function yOf(d){return d.slice(0,4);}

function passSearch(e){
  if(!q) return true;
  var hay=(e.topics||[]).join(" ")+" "+(e.summary||"");
  return hay.toLowerCase().indexOf(q.toLowerCase())>=0;
}
function inScope(e){
  if(year && yOf(e.date)!==year) return false;
  if(month && ymOf(e.date)!==month) return false;
  return passSearch(e);
}
function labCount(e,l){return (e.counts&&e.counts[l])||0;}
function isDim(e){return lab!=="all" && labCount(e,lab)===0;}

function badges(e,hide){
  if(hide) return "";
  var out="";
  for(var i=0;i<LABELS.length;i++){
    var l=LABELS[i], n=labCount(e,l);
    if(n>0) out+='<span class="lab '+LABCLASS[l]+'">'+l+" "+n+"</span>";
  }
  return out;
}

function renderYears(){
  var box=document.getElementById("years"); box.innerHTML="";
  for(var i=0;i<YEARS.length;i++){
    var y=YEARS[i];
    var n=ALL.filter(function(e){return yOf(e.date)===y;}).length;
    var c=document.createElement("span");
    c.className="chip"+(year===y?" on":""); c.tabIndex=0; c.setAttribute("role","button");
    c.textContent=y+"年 ("+n+")";
    (function(yy){ c.onclick=function(){selectYear(yy,null);};
      c.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectYear(yy,null);}};})(y);
    box.appendChild(c);
  }
}

function monthsOf(y){
  var m={};
  ALL.forEach(function(e){ if(yOf(e.date)===y) m[ymOf(e.date)]=(m[ymOf(e.date)]||0)+1; });
  return Object.keys(m).sort().reverse().map(function(k){return {ym:k,n:m[k]};});
}

function renderMonths(){
  var box=document.getElementById("months"); box.innerHTML="";
  if(!year) return;
  var all=document.createElement("span");
  all.className="chip"+(month===null?" on":""); all.tabIndex=0; all.setAttribute("role","button");
  all.textContent="年全体";
  all.onclick=function(){selectYear(year,null);};
  all.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectYear(year,null);}};
  box.appendChild(all);
  monthsOf(year).forEach(function(o){
    var c=document.createElement("span");
    c.className="chip"+(month===o.ym?" on":""); c.tabIndex=0; c.setAttribute("role","button");
    c.textContent=Number(o.ym.slice(5,7))+"月 ("+o.n+")";
    c.onclick=function(){selectYear(year,o.ym);};
    c.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectYear(year,o.ym);}};
    box.appendChild(c);
  });
}

function renderGrid(){
  var grid=document.getElementById("grid"), cnt=document.getElementById("count");
  var items=ALL.filter(inScope);
  grid.innerHTML="";
  var shown=items.length, dimmed=0;
  if(!shown){
    grid.innerHTML='<div class="empty">該当する日がありません。</div>';
  }
  items.forEach(function(e){
    var dim=isDim(e); if(dim) dimmed++;
    var b=document.createElement("button");
    b.className="card"+(dim?" dim":""); b.type="button";
    b.setAttribute("aria-label",e.date+" を開く");
    var dt=new Date(e.date+"T00:00:00");
    var tp=(e.topics||[]).map(function(t){return "<span>"+esc(t)+"</span>";}).join("");
    var kindTag=(e.kind&&e.kind!=="news")?'<span class="kind">検証</span>':"";
    b.innerHTML='<div class="d">'+e.date+'<span class="wd">'+WD[dt.getDay()]+"</span>"+kindTag+"</div>"
      +(tp?'<div class="topics">'+tp+"</div>":"")
      +'<div class="sm">'+esc(e.summary||"（要約できる本文がありません）")+"</div>"
      +'<div class="badges">'+badges(e,dim)+"</div>";
    b.onclick=function(){openDay(e.date);};
    grid.appendChild(b);
  });
  var msg=shown+" 日";
  if(lab!=="all") msg+="（"+lab+" あり "+(shown-dimmed)+" 日 / なし "+dimmed+" 日は薄く表示）";
  if(q) msg+="・検索: "+q;
  cnt.textContent=msg;
}

function selectYear(y,m){
  year=y; month=m; openDate=null;
  document.getElementById("panel").hidden=true;
  document.getElementById("grid").style.display="";
  renderYears(); renderMonths(); renderGrid();
  setHash(m?m:y);
}

function closeDay(){
  openDate=null;
  document.getElementById("panel").hidden=true;
  document.getElementById("grid").style.display="";
  renderGrid();
  setHash(month?month:year);
  window.scrollTo(0,gridScroll);
}

function openDay(date){
  var e=ALL.filter(function(x){return x.date===date;})[0];
  if(!e){ return; }
  gridScroll=window.scrollY||0;
  openDate=date;
  year=yOf(date);
  if(month && ymOf(date)!==month) month=ymOf(date);
  renderYears(); renderMonths();
  var p=document.getElementById("panel");
  document.getElementById("grid").style.display="none";
  p.hidden=false;
  p.innerHTML='<div class="phead"><div class="pdate">'+e.date+"</div><div>"+badges(e,false)+"</div>"
    +'<div class="pclose"><a class="btn" href="'+esc(e.file)+'" target="_blank" rel="noopener">単体で開く</a>'
    +'<button class="btn" id="xclose" type="button">閉じる（Esc）</button></div></div>'
    +'<div class="loading">読み込み中…</div>';
  document.getElementById("xclose").onclick=closeDay;
  window.scrollTo(0,0);
  setHash(date);
  fetch(e.file).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(t){
    var m=t.indexOf("<!--CONTENT:BEGIN-->"), n=t.indexOf("<!--CONTENT:END-->");
    var body=(m>=0&&n>m)?t.slice(m+20,n):t;
    if(openDate!==date) return;
    p.querySelector(".loading").outerHTML='<article>'+body+"</article>";
  }).catch(function(err){
    if(openDate!==date) return;
    var el=p.querySelector(".loading");
    if(el) el.innerHTML="本文を読み込めませんでした（"+esc(err.message)+"）。"
      +'<a href="'+esc(e.file)+'">単体ページで開く</a>';
  });
}

function setHash(v){ navLock=true; location.hash=v?("#"+v):""; setTimeout(function(){navLock=false;},0); }

function applyHash(){
  var h=(location.hash||"").replace(/^#/,"");
  if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(h) && ALL.some(function(e){return e.date===h;})){
    // hash 直指定(リロード・共有)では年月の文脈が無いので、その日の年月に合わせる。
    // カードクリック経由では現在の年月(年全体を含む)を保ち、閉じたら元の文脈へ戻す。
    year=yOf(h); month=ymOf(h);
    openDay(h); return;
  }
  if(/^[0-9]{4}-[0-9]{2}$/.test(h)){ selectYear(h.slice(0,4),h); return; }
  if(/^[0-9]{4}$/.test(h) && YEARS.indexOf(h)>=0){ selectYear(h,null); return; }
  var latest=ALL[0];
  if(latest) selectYear(yOf(latest.date), ymOf(latest.date));
}

document.getElementById("q").oninput=function(ev){
  q=ev.target.value.trim();
  if(openDate) closeDay(); else renderGrid();
};
Array.prototype.forEach.call(document.querySelectorAll("#labelfilters .chip"),function(c){
  function pick(){
    Array.prototype.forEach.call(document.querySelectorAll("#labelfilters .chip"),
      function(x){x.classList.remove("on");});
    c.classList.add("on"); lab=c.dataset.lab;
    if(openDate) closeDay(); else renderGrid();
  }
  c.onclick=pick;
  c.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick();}};
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape" && openDate) closeDay();
});
window.addEventListener("hashchange",function(){ if(!navLock) applyHash(); });

fetch("index.json").then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(j){
  ALL=(j.entries||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var ys={}; ALL.forEach(function(e){ys[yOf(e.date)]=1;});
  YEARS=Object.keys(ys).sort().reverse();
  applyHash();
}).catch(function(err){
  document.getElementById("grid").innerHTML=
    '<div class="empty">一覧（index.json）を読み込めませんでした: '+esc(err.message)+"</div>";
});
</script></body></html>
